name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'バージョンアップの種類'
        required: true
        default: 'patch'
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  REPO_URL: https://github.com/treetips/tree-voice-assistant

jobs:
  release:
    name: Build & Create Release
    runs-on: macos-latest

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------
      # Bump version in Info.plist
      # セマンティックバージョンは「最新のリリースタグ」＋実行時の bump
      # 指定（major/minor/patch）から算出する。
      # ビルド番号は「最新のリリースの update-info.json の build」＋1
      # から算出する（初回などで取得できない場合のみ Info.plist＋1）。
      # ローカルの手動更新は不要。Info.plist だけを書き換え、
      # main への push / PR 作成は行わない。
      # アプリが表示・比較するバージョンは静的な Info.plist の
      # CFBundleShortVersionString / CFBundleVersion が正本のため
      # （GENERATE_INFOPLIST_FILE=NO のため INFOPLIST_KEY_* は無視される）。
      # リポジトリルール（main への直接 push 禁止）を回避するため。
      # タグの push は許可されているためリリースはタグ経由で行う。
      # ------------------------------------------------------------
      - name: Bump version in Info.plist
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PLIST="TreeVoiceAssistant/TreeVoiceAssistant/Info.plist"
          LATEST_TAG="$(git tag -l 'v*' | sort -V | tail -n1 || true)"
          if [[ -n "$LATEST_TAG" ]]; then
            CURRENT="${LATEST_TAG#v}"
          else
            CURRENT="$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$PLIST")"
          fi
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
          esac
          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"
          PREV_BUILD="$(curl -sL "${{ env.REPO_URL }}/releases/latest/download/update-info.json" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("build", 0))' 2>/dev/null || echo 0)"
          if [[ "$PREV_BUILD" =~ ^[0-9]+$ ]] && [[ "$PREV_BUILD" -gt 0 ]]; then
            NEW_BUILD=$((PREV_BUILD + 1))
          else
            REPO_BUILD="$(/usr/libexec/PlistBuddy -c "Print CFBundleVersion" "$PLIST")"
            NEW_BUILD=$((REPO_BUILD + 1))
          fi
          TAG_NAME="v${NEW_VERSION}"

          if ! [[ "$NEW_BUILD" =~ ^[0-9]+$ ]]; then
            echo "::error::Build number must be numeric: $NEW_BUILD"
            exit 1
          fi

          /usr/libexec/PlistBuddy -c "Set CFBundleShortVersionString $NEW_VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set CFBundleVersion $NEW_BUILD" "$PLIST"

          echo "Base tag:         ${LATEST_TAG:-none}"
          echo "Semantic version: $NEW_VERSION"
          echo "Build number:     $NEW_BUILD"
          echo "Tag name:         $TAG_NAME"

          {
            echo "version=$NEW_VERSION"
            echo "build_number=$NEW_BUILD"
            echo "tag=$TAG_NAME"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Check existing tag
      # ------------------------------------------------------------
      - name: Check if tag already exists
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists in repository."
            echo "::error::Please choose another bump type before running release workflow."
            exit 1
          fi

      # tools配布が無いままアプリを公開すると、新規クライアントがtoolsを準備できない。
      - name: Verify tools release exists
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST="$RUNNER_TEMP/tools-info.json"
          URLS="$RUNNER_TEMP/tools-urls.txt"
          curl -fsSL --retry 3 --connect-timeout 10 \
            "$REPO_URL/releases/download/tools-latest/tools-info.json" -o "$MANIFEST"
          python3 - "$MANIFEST" "$REPO_URL" "$URLS" <<'PY'
          import json
          import pathlib
          import re
          import sys

          manifest_path, repo_url, urls_path = sys.argv[1:]
          try:
              data = json.loads(pathlib.Path(manifest_path).read_text(encoding="utf-8"))
          except (OSError, UnicodeError, json.JSONDecodeError) as error:
              raise SystemExit(f"tools-info.json を読み込めません: {error}")
          if data.get("schemaVersion") != 1 or not isinstance(data.get("tools"), list):
              raise SystemExit("tools-info.json の形式が不正です")
          expected = {"uv", "tts", "tts-irodori"}
          names = [entry.get("name") for entry in data["tools"] if isinstance(entry, dict)]
          if len(names) != len(set(names)) or set(names) != expected:
              raise SystemExit("tools-info.json のツール一覧が不正です")
          urls = []
          for entry in data["tools"]:
              url = entry.get("url")
              checksum = entry.get("sha256")
              if not isinstance(url, str) or not url.startswith(
                  f"{repo_url}/releases/download/tools-latest/"
              ):
                  raise SystemExit(f"{entry['name']} のURLが不正です")
              if not isinstance(checksum, str) or re.fullmatch(r"[0-9a-fA-F]{64}", checksum) is None:
                  raise SystemExit(f"{entry['name']} のSHA-256が不正です")
              if entry.get("required") is not True:
                  raise SystemExit(f"{entry['name']} が必須ツールではありません")
              urls.append(url)
          pathlib.Path(urls_path).write_text("\n".join(urls) + "\n", encoding="utf-8")
          PY
          while IFS= read -r url; do
            if ! curl -fsSL --head --retry 3 --connect-timeout 10 -o /dev/null "$url"; then
              echo "::error::tools配布資産を取得できません: $url"
              exit 1
            fi
          done < "$URLS"

      # ------------------------------------------------------------
      # Select Xcode version
      # `.xcode-version` に固定したXcodeを選択する（CIと同一）。
      # Runnerに該当バージョンが無い場合は、最新のインストール済みXcodeに
      # フォールバックする。
      # ------------------------------------------------------------
      - name: Select Xcode version
        run: |
          VERSION="$(cat .xcode-version)"
          echo "Required Xcode version: $VERSION"
          find /Applications -maxdepth 1 -name 'Xcode*.app' -print
          PINNED="/Applications/Xcode_${VERSION}.app"
          if [[ -d "$PINNED" ]]; then
            echo "Using pinned Xcode: $PINNED"
            sudo xcode-select -s "$PINNED/Contents/Developer"
          else
            echo "::warning::Xcode ${VERSION} is not installed; falling back to the newest available Xcode."
            LATEST="$(find /Applications -maxdepth 1 -name 'Xcode_*.app' -print | sort -V | tail -n1 || true)"
            if [[ -z "$LATEST" ]]; then
              LATEST="/Applications/Xcode.app"
            fi
            echo "Using fallback Xcode: $LATEST"
            sudo xcode-select -s "$LATEST/Contents/Developer"
          fi

      - name: Show Xcode version
        run: xcodebuild -version

      # ------------------------------------------------------------
      # Tests
      # ------------------------------------------------------------
      - name: Run SwiftUI tests
        run: >
          xcodebuild
          -project TreeVoiceAssistant/TreeVoiceAssistant.xcodeproj
          -scheme TreeVoiceAssistant
          -configuration Debug
          test

      # ------------------------------------------------------------
      # Build macOS release
      # バージョンは直前のステップで Info.plist に書き込み済み。
      # ------------------------------------------------------------
      - name: Build macOS release
        run: >
          xcodebuild
          -project TreeVoiceAssistant/TreeVoiceAssistant.xcodeproj
          -scheme TreeVoiceAssistant
          -configuration Release
          -derivedDataPath "$GITHUB_WORKSPACE/build-release"
          build

      # ------------------------------------------------------------
      # Re-sign app (ad-hoc)
      # Developer Program へ未加入でも動作する形。最後に ad-hoc で
      # 再署名して署名の整合性を担保する。ダウンロード後は Gatekeeper の
      # 「開発者を確認できない」警告が出るため、ユーザーが手動で許可して
      # 起動する形となる。
      # ------------------------------------------------------------
      - name: Re-sign app (ad-hoc)
        run: |
          set -euo pipefail
          APP_PATH="$GITHUB_WORKSPACE/build-release/Build/Products/Release/TreeVoiceAssistant.app"
          echo "Re-signing app (deep, ad-hoc)..."
          codesign --force --deep --sign - "$APP_PATH"
          echo "Verifying signature..."
          codesign --verify --deep --strict "$APP_PATH"

      # ------------------------------------------------------------
      # Package release assets
      # 自前アップデート（UpdateService）が読むのは .app の zip と
      # update-info.json のみ。tools は別の tools-latest Release で配布する。
      # ------------------------------------------------------------
      - name: Package release assets
        id: package
        shell: bash
        run: |
          set -euo pipefail
          # AppleDouble（._*）がtoolsやアプリ内へ混入しないようにする。
          export COPYFILE_DISABLE=1
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ steps.version.outputs.build_number }}"

          APP_PATH="$GITHUB_WORKSPACE/build-release/Build/Products/Release/TreeVoiceAssistant.app"
          if [[ ! -d "$APP_PATH" ]]; then
            echo "::error::App not found at $APP_PATH"
            exit 1
          fi

          # ZIP を作成。
          ZIP_NAME="Tree-Voice-Assistant-v${VERSION}-macos.zip"
          mkdir -p dist-release
          ditto -c -k --keepParent "$APP_PATH" "dist-release/$ZIP_NAME"
          echo "Created: dist-release/$ZIP_NAME"

          # SHA-256 を計算。
          (cd dist-release && shasum -a 256 "$ZIP_NAME" > SHA256SUMS.txt)
          SHA256="$(awk '{print $1}' "dist-release/SHA256SUMS.txt")"
          echo "SHA-256: $SHA256"

          # update-info.json を生成。
          DOWNLOAD_URL="${{ env.REPO_URL }}/releases/download/v${VERSION}/${ZIP_NAME}"
          cat > dist-release/update-info.json <<EOF
          {
            "version": "${VERSION}",
            "build": ${BUILD},
            "url": "${DOWNLOAD_URL}",
            "sha256": "${SHA256}"
          }
          EOF
          echo "Created: dist-release/update-info.json"
          cat dist-release/update-info.json

          {
            echo "zip_name=$ZIP_NAME"
            echo "zip_path=dist-release/$ZIP_NAME"
            echo "checksum_path=dist-release/SHA256SUMS.txt"
            echo "update_info_path=dist-release/update-info.json"
            echo "sha256=$SHA256"
          } >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # Create and push Git tag
      # ------------------------------------------------------------
      - name: Create and push Git tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          git fetch origin main --tags
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      # ------------------------------------------------------------
      # Create GitHub Release
      # ------------------------------------------------------------
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          TITLE="Tree Voice Assistant v${VERSION}"

          gh release create "$TAG" \
            "${{ steps.package.outputs.zip_path }}" \
            "${{ steps.package.outputs.checksum_path }}" \
            "${{ steps.package.outputs.update_info_path }}" \
            --title "$TITLE" \
            --generate-notes
