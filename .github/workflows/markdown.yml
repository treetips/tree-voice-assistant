name: Markdown

# 全ブランチのpushとすべてのPRで毎回実行する。
# 変更ファイルで絞らないのは、Markdown以外の変更でも検査を素通りさせず、
# どのブランチでも違反が残らないことを常に確認するため（実行は数秒で終わる）。
on: [push, pull_request]

jobs:
  check:
    name: Lint & Format Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # バージョンを固定してローカルとCIで検査結果が変わらないようにする。
      # PRのFiles changedタブに違反箇所をアノテーション表示する。
      - name: Lint Markdown
        uses: rvben/rumdl@v0
        with:
          version: '0.3.2'
          report-type: annotations

      # フォーマット崩れ（`rumdl fmt` で変わる差分の有無）も検査する。
      - name: Check formatting
        uses: rvben/rumdl@v0
        with:
          version: '0.3.2'
          command: fmt-check
