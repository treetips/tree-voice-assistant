name: Label PR

# PRタイトルのConventional Commits接頭辞からラベルを自動付与する。
# GitHubのリリースノートは.github/release.ymlのラベル基準でカテゴリ分類
# されるため、ラベル付与が漏れると全PRが「その他」に分類されてしまう。
on:
  pull_request:
    branches:
      - main
    types: [opened, edited, reopened]

permissions:
  pull-requests: write

jobs:
  label:
    name: ラベル自動付与
    runs-on: ubuntu-latest
    steps:
      - name: 接頭辞の判定とラベル付与
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # タイトルの先頭から最初の「:」までを接頭辞部として扱う。
          prefix_raw="${PR_TITLE%%:*}"
          # typeのみを抽出する。scopeがある場合は別途分離する。
          # 例: "feat(scope): 題名" → prefix_raw="feat(scope)", type="feat", scope="scope"
          type="${prefix_raw%%(*}"
          type="$(printf '%s' "$type" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          scope=""
          if [[ "$prefix_raw" == *'('* ]]; then
            scope="$(printf '%s' "$prefix_raw" | sed -E 's/^[^(]*\(([^)]+)\).*/\1/' | tr '[:upper:]' '[:lower:]')"
          fi

          # 接頭辞と.github/release.yml側ラベルの対応。
          # 対応がなければ空のままにし、「その他」カテゴリに分類させる。
          label=""
          case "$type" in
            feat)     label="feature" ;;
            fix)      label="fix" ;;
            perf)     label="performance" ;;
            refactor) label="improvement" ;;
            docs)     label="documentation" ;;
            build|chore|ci)
              # scopeがdeps/dependenciesのときのみ依存更新として分類する。
              if [[ "$scope" == "deps" || "$scope" == "dependencies" ]]; then
                label="dependencies"
              fi
              ;;
            *)
              # Dependabotのような「Bump ...」形式のタイトルを依存更新として扱う。
              if [[ "$PR_TITLE" == "Bump "* ]]; then
                label="dependencies"
              fi
              ;;
          esac

          # タイトル変更時の再分類に備え、既存の自動ラベルを外して付け直す。
          auto_labels=(feature fix performance improvement documentation dependencies)
          for l in "${auto_labels[@]}"; do
            gh pr edit "$PR_NUMBER" --repo "$REPO" --remove-label "$l" 2>/dev/null || true
          done

          if [[ -n "$label" ]]; then
            echo "Adding label: $label"
            gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "$label"
          else
            echo "No matching label (will appear in 'Other Changes' category)"
          fi
