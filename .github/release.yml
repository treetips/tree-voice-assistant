changelog:
  categories:
    - title: "✨ 新機能 (Features)"
      labels:
        - "feature"
        - "enhancement"
    - title: "🐛 バグ修正 (Bug Fixes)"
      labels:
        - "fix"
        - "bug"
    - title: "⚡ パフォーマンス・改善 (Improvements)"
      labels:
        - "performance"
        - "improvement"
        - "refactor"
    - title: "📦 依存パッケージ更新 (Dependencies)"
      labels:
        - "dependencies"
    - title: "📝 ドキュメント (Documentation)"
      labels:
        - "documentation"
        - "docs"
    - title: "🔧 その他 (Other Changes)"
      labels:
        - "*"
